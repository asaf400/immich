# .github/workflows/docker-build.yml
#
# This workflow builds a Docker image using a patched Dockerfile from a third-party repo.
# It is designed to trigger AFTER your other workflow creates a new release on your fork.
#
name: Build and Push Patched Docker Image

# 1. TRIGGER: This workflow runs when a new "release" is "published" in YOUR repository.
# This is the key event that connects it to your auto-update workflow.
on:
  release:
    types: [released]
  workflow_dispatch:

# 2. PERMISSIONS:
#    - packages: write is required to push the built image to GitHub Container Registry (GHCR).
#    - contents: read is good practice, though not strictly needed here.
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 3. SETUP: Log in to GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # GITHUB_TOKEN is automatically created by Actions
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. SETUP: Set up Docker Buildx for building
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. PREPARE: Define some variables for clarity
      # We'll get the repo name (e.g., "my-immich-fork") and lowercase it for the Docker image name.
      - name: Prepare image name and tags
        id: prep
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')
          RELEASE_TAG="${{ github.event.release.tag_name }}"

          echo "IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/$REPO_NAME" >> $GITHUB_OUTPUT
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_OUTPUT

          echo "Building image: ghcr.io/${{ github.repository_owner }}/$REPO_NAME:$RELEASE_TAG"

      # 6. FIND ASSET: Get the URL for the custom .tar.gz asset from the release
      - name: Find release asset
        id: find_asset
        run: |
          # Get the JSON metadata for all release assets
          ASSET_JSON='${{ toJSON(github.event.release.assets) }}'

          # Use jq to find the first asset ending in .tar.gz and get its URL
          # If your asset has a different name, change the '.name | endswith(".tar.gz")' filter
          ASSET_URL=$(echo "$ASSET_JSON" | jq -r '.[] | select(.name | endswith(".tar.gz")) | .browser_download_url' | head -n 1)

          if [ -z "$ASSET_URL" ]; then
            echo "Error: Could not find a .tar.gz asset in the release."
            exit 1
          fi

          echo "Found asset URL: $ASSET_URL"
          echo "ASSET_URL=$ASSET_URL" >> $GITHUB_OUTPUT

      - name: Checkout tools repo
        uses: actions/checkout@v5
        with:
          repository: imagegenius/docker-immich
          path: docker-immich

      # 6. PATCH: Download and patch the third-party Dockerfile
      - name: Download and Patch Dockerfile
        id: patch
        run: |
          sed -e 's@https://github.com/immich-app/immich/archive/${IMMICH_VERSION}.tar.gz@${{ steps.find_asset.outputs.ASSET_URL }}@g' docker-immich/Dockerfile > docker-immich/Dockerfile.patched

          echo "Dockerfile patched successfully."
          echo "Patched Dockerfile:"
          cat docker-immich/Dockerfile.patched

      # 7. BUILD & PUSH:
      # This step builds the image using the patched Dockerfile and pushes it to GHCR.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          # Context is the current directory ('.')
          context: ./docker-immich
          # We explicitly tell it to use our patched file
          file: ./docker-immich/Dockerfile.patched
          # This tells the action to push the image after building
          push: true
          # We tag the image with both the release tag and 'latest'
          tags: |
            ${{ steps.prep.outputs.IMAGE_NAME }}:${{ steps.prep.outputs.RELEASE_TAG }}
            ${{ steps.prep.outputs.IMAGE_NAME }}:latest
          # Enable build cache for faster subsequent builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
